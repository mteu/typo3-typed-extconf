name: Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  TYPO3_DISABLE_DOCS_VERSION_UPDATE: 1
  TYPO3_EXTENSION_KEY: typed_extconf
  TYPO3_EXCLUDE_FROM_PACKAGING: packaging_exclude.php
  EXTENSION_ARTEFACT: typed_extconf_${{ github.ref_name }}.zip

jobs:
  # build extension for TER publishing
  build:
    name: Build extension artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Check if tag is valid
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Tag must be a semantic version (X.Y.Z)."
            exit 1
          fi

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          tools: composer:v2, typo3/tailor:2.0.0
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          ignore-cache: true

      - name: Bundle vendor libraries
        run: composer bundle -v

      - name: Stash bundled files
        run: |
          git add -f Resources/Private/Libs
          git stash push -- composer.json Resources/Private/Libs

      - name: Reset files
        run: git reset --hard HEAD && git clean -dfx

      - name: Restore bundled files
        run: git stash pop

      - name: Create artefact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          php ~/.composer/vendor/bin/tailor set-version "$TAG"
          php ~/.composer/vendor/bin/tailor create-artefact "$TAG"

      - name: Upload extension artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-artefact
          path: tailor-version-artefact/${{ env.EXTENSION_ARTEFACT }}

  # Job: Create release
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-notes-url: ${{ steps.create-release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download extension artefact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-artefact

      # Create release
      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: ${{ steps.download.outputs.download-path }}/${{ env.EXTENSION_ARTEFACT }}

  # Publish to TER
  ter-publish:
    name: Publish on TER
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download extension artefact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-artefact

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2, typo3/tailor:2.0.0

      # Release
      - name: Publish to TER
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES_URL: ${{ needs.release.outputs.release-notes-url }}
          ARTEFACT_DIR: ${{ steps.download.outputs.download-path }}
        run: |
          php ~/.composer/vendor/bin/tailor ter:publish \
            --comment "See release notes at $RELEASE_NOTES_URL" \
            --artefact "$ARTEFACT_DIR/$EXTENSION_ARTEFACT" \
            "$TAG"
